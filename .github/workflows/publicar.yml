# Publica o jogo no GitHub Pages a cada push na main.
#
# O jogo é estático: `npm run build` gera a pasta dist/ e é ela que vai pro ar.
# Nada aqui roda no servidor — o Pages só serve arquivos.
#
# Para funcionar, uma vez só, no navegador:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Sem isso o passo de publicar falha dizendo que o Pages não está habilitado.
name: Publicar o jogo

on:
  push:
    branches: [main]
  # Permite republicar pelo botão "Run workflow", sem precisar de um commit.
  workflow_dispatch:

# Permissões que o deploy-pages exige. Sem id-token ele não consegue provar
# pro GitHub que o artefato veio deste workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Dois pushes seguidos não disputam o mesmo ambiente: o segundo espera, e o
# que estiver na fila (não o que já está publicando) é descartado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # O package-lock.json é APAGADO de propósito antes de instalar. Isto não
      # é desleixo — é a única saída, e é a que o próprio erro recomenda.
      #
      # O Vite 8 usa o rolldown, que tem um binário compilado por plataforma
      # (@rolldown/binding-linux-x64-gnu, -win32-x64-msvc, e mais treze). O npm
      # só grava no lock o binário da máquina onde o lock foi gerado, e este
      # foi gerado no Windows: ele tem o -win32-x64-msvc e NENHUM de Linux.
      # Rodando no Ubuntu, o vitest morre na partida com
      #
      #     Cannot find module '@rolldown/binding-linux-x64-gnu'
      #     npm has a bug related to optional dependencies (npm/cli#4828)
      #     Please try `npm i` again after removing both package-lock.json
      #     and node_modules directory.
      #
      # Nem `npm ci` nem `npm install` resolvem sozinhos: com o lock presente,
      # o npm considera a árvore satisfeita e não vai atrás do que falta. E o
      # lock não tem conserto a partir do Windows — `--package-lock-only`,
      # `--os=linux --cpu=x64` e `--force` continuam gravando só o binário
      # local.
      #
      # O custo é perder a fixação exata de versões nesta instalação: as
      # dependências passam a resolver dentro das faixas do package.json. O
      # `npm test` logo abaixo é a rede de proteção — se alguma versão nova
      # quebrar algo, a publicação para e o site continua servindo a última
      # versão boa.
      #
      # Para recuperar o `npm ci`, basta gerar o lock uma vez em Linux (WSL ou
      # Codespaces) e commitá-lo: aí ele terá o binário que falta.
      - run: rm -f package-lock.json && npm install

      # Os testes unitários rodam antes do build e seguram a publicação se
      # algo quebrar — são rápidos (menos de um segundo) e evitam colocar no
      # ar uma versão com regra de jogo quebrada. Os testes do Playwright
      # ficam de fora de propósito: precisam baixar um navegador a cada
      # execução e transformariam um deploy de 1 minuto em vários.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
