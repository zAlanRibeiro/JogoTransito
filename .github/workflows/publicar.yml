# Publica o jogo no GitHub Pages a cada push na main.
#
# O jogo é estático: `npm run build` gera a pasta dist/ e é ela que vai pro ar.
# Nada aqui roda no servidor — o Pages só serve arquivos.
#
# Para funcionar, uma vez só, no navegador:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Sem isso o passo de publicar falha dizendo que o Pages não está habilitado.
name: Publicar o jogo

on:
  push:
    branches: [main]
  # Permite republicar pelo botão "Run workflow", sem precisar de um commit.
  workflow_dispatch:

# Permissões que o deploy-pages exige. Sem id-token ele não consegue provar
# pro GitHub que o artefato veio deste workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Dois pushes seguidos não disputam o mesmo ambiente: o segundo espera, e o
# que estiver na fila (não o que já está publicando) é descartado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm install`, e NÃO `npm ci` — isto não é preferência, é o que faz o
      # build funcionar aqui.
      #
      # O Vite 8 usa o rolldown, que tem um binário compilado por plataforma
      # (@rolldown/binding-linux-x64-gnu, -win32-x64-msvc, e mais treze). O
      # npm só grava no package-lock.json o binário da máquina onde o lock foi
      # gerado — e este foi gerado no Windows. Como `npm ci` instala
      # estritamente o que está no lock, no Ubuntu daqui o binário de Linux
      # nunca chegava e o vitest morria ao iniciar, com um "exit code 1" sem
      # explicação. Foi exatamente assim que a primeira publicação falhou.
      #
      # `npm install` re-resolve as dependências opcionais para o SO atual e
      # baixa o binário certo. As versões continuam vindo do lock; o que muda
      # é só a escolha do binário nativo.
      - run: npm install

      # Os testes unitários rodam antes do build e seguram a publicação se
      # algo quebrar — são rápidos (menos de um segundo) e evitam colocar no
      # ar uma versão com regra de jogo quebrada. Os testes do Playwright
      # ficam de fora de propósito: precisam baixar um navegador a cada
      # execução e transformariam um deploy de 1 minuto em vários.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
