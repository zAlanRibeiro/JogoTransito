<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Semáforo: é o símbolo do jogo e o que melhor se reconhece a 16px, que
       é o tamanho em que ele vive na aba do navegador. Corpo azul-marinho e
       contorno laranja são a dupla da marca NITTRANS — e o contorno não é só
       enfeite: é ele que mantém o ícone visível em aba de tema escuro, onde
       o azul-marinho sozinho quase some. As luzes ocupam quase toda a
       largura do corpo de propósito; menores viram três pontos ilegíveis. -->
  <rect x="3.5" y="1" width="25" height="30" rx="7" fill="#1e3c72" stroke="#ff7b00" stroke-width="2" />
  <circle cx="16" cy="8.5" r="4.6" fill="#e74c3c" />
  <circle cx="16" cy="16" r="4.6" fill="#f1c40f" />
  <circle cx="16" cy="23.5" r="4.6" fill="#2ecc71" />
</svg>
